<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TEST</title>
<style>body{margin:0;font-family:Arial;background:#fffbe6}.top{background:orange;text-align:center;padding:10px;font-weight:bold}.pink{background:#e91e63;color:#fff;text-align:center;padding:20px}.box{background:#fff;margin:12px;padding:15px;border-radius:12px}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;margin-top:8px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}</style></head><body>

<div class="top">TEST MODE - This is working</div>
<div class="pink"><h2>TEST Shop</h2><p>Owner 7989333257</p>
<a href="#admin"><button style="background:#fff;color:#e91e63;border-radius:20px">Go to TEST Admin ↓</button></a>
</div>

<div class="box">
<b>Blue Saree - Rs100</b>
<button onclick="buy('Blue Saree',100)" style="background:#e91e63;color:#fff">CLICK TO TEST ORDER</button>
</div>

<div class="box">
<b>Green Saree - Rs120</b>
<button onclick="buy('Green Saree',120)" style="background:#e91e63;color:#fff">CLICK TO TEST ORDER</button>
</div>

<div id="admin" class="box" style="border:2px solid #000">
<h3 style="text-align:center">TEST Admin</h3>
<input id="ph" type="tel" placeholder="Enter 9999999999">
<button onclick="show()" style="background:#000;color:#fff">SHOW ORDERS</button>
<button onclick="clearT()" style="background:red;color:#fff">CLEAR ALL TEST</button>
<div id="list" style="margin-top:12px"></div>
<p style="text-align:center;margin-top:12px"><a href="index.html">LIVE Shop</a> | <a href="admin.html">LIVE Admin</a></p>
</div>

<script>
function buy(n,p){var phone=prompt("Enter phone 9999999999");if(!phone)return;var a=JSON.parse(localStorage.getItem("umas_test_orders")||"[]");a.push({id:"TEST"+Date.now(),phone:phone,productName:n,total:p,status:"Pending",date:new Date().toISOString()});localStorage.setItem("umas_test_orders",JSON.stringify(a));alert("Order Done "+phone);document.getElementById("ph").value=phone;show();}
function show(){var ph=document.getElementById("ph").value;var a=JSON.parse(localStorage.getItem("umas_test_orders")||"[]");if(ph)a=a.filter(o=>String(o.phone).includes(ph));var h="";if(a.length==0)h="<p style=text-align:center>No orders yet - Click above button</p>";else{a.reverse().forEach(o=>{h+="<div style='background:#f5f5f5;padding:10px;border-radius:8px;margin-bottom:8px;border-left:5px solid #e91e63'><b>"+o.phone+"</b> - "+o.status+"<br>"+o.productName+" Rs"+o.total+"<br><small>"+o.id+"</small><br><button onclick=cancelO('"+o.id+"') style='background:#fff;color:red;border:1px solid red;padding:5px 10px;border-radius:10px;margin-top:5px'>Cancel</button> <button onclick=delO('"+o.id+"') style='background:#fff;border:1px solid #000;padding:5px 10px;border-radius:10px'>Delete</button></div>";});}document.getElementById("list").innerHTML=h;}
function cancelO(id){var a=JSON.parse(localStorage.getItem("umas_test_orders")||"[]");var o=a.find(x=>x.id==id);if(o){o.status="Cancelled";localStorage.setItem("umas_test_orders",JSON.stringify(a));show();}}
function delO(id){var a=JSON.parse(localStorage.getItem("umas_test_orders")||"[]");a=a.filter(x=>x.id!=id);localStorage.setItem("umas_test_orders",JSON.stringify(a));show();}
function clearT(){if(!confirm("Clear?"))return;localStorage.removeItem("umas_test_orders");show();}
show();
</script>
</body></html>
