<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEW Admin</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding:10px}.head{background:#000;color:#fff;padding:15px;border-radius:12px;text-align:center}.box{background:#fff;padding:12px;border-radius:10px;margin-top:10px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}button{padding:10px;border:0;border-radius:8px;font-weight:bold}.order{background:#fff;border-radius:10px;padding:12px;margin-top:10px;border-left:5px solid #e91e63}</style></head><body>
<div class="head"><h2>NEW Admin - Cancel Approval</h2><p>Cancel requests shown FIRST with orange</p><p style="margin-top:8px"><a href="index-new.html" style="color:orange">NEW Shop</a> | <a href="admin.html" style="color:#fff">OLD Admin</a></p></div>
<div class="box"><input id="s" type="tel" placeholder="Search phone..." oninput="load()"><div style="display:flex;gap:6px;margin-top:8px"><button onclick="load()" style="flex:1;background:#e91e63;color:#fff">Search</button><button onclick="clearAll()" style="flex:1;background:#000;color:#fff">Clear All NEW</button></div></div>
<div id="list"></div>
<script>
function clearAll(){if(!confirm('Clear all NEW?'))return;localStorage.removeItem('umas_orders_new');load();}
function load(){
let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]').filter(o=>o&&o.phone&&String(o.phone).length>=9&&o.id);
let q=document.getElementById('s').value.trim();if(q)all=all.filter(o=>String(o.phone).includes(q));
all.sort((a,b)=>{if(a.status=='Cancel Requested'&&b.status!='Cancel Requested')return -1;if(b.status=='Cancel Requested'&&a.status!='Cancel Requested')return 1;return 0;});
if(all.length==0){document.getElementById('list').innerHTML='<p style=text-align:center;padding:30px;background:#fff;border-radius:12px;margin-top:10px'>No NEW orders<br>Place order in NEW Shop</p>';return;}
document.getElementById('list').innerHTML=all.reverse().map(o=>{
let box='';if(o.status=='Cancel Requested'){box=`<div style='background:#fff3e0;padding:10px;border-radius:8px;margin-top:8px;border:1px solid orange'><b style='color:orange'>⚠️ CANCELLATION REQUESTED</b><br><small>Reason: ${o.cancelReason||'No reason'}<br>Time: ${o.cancelRequestDate?new Date(o.cancelRequestDate).toLocaleString():''}</small><div style='display:flex;gap:8px;margin-top:8px'><button onclick="approveCancel('${o.id}')" style='flex:1;background:green;color:#fff;padding:12px;border-radius:8px'>✅ Approve</button><button onclick="rejectCancel('${o.id}')" style='flex:1;background:#000;color:#fff;padding:12px;border-radius:8px'>❌ Reject</button></div></div>`;}
return `<div class="order" style="border-left-color:${o.status=='Cancel Requested'?'orange':'#e91e63'}"><div style="display:flex;justify-content:space-between"><b>📱 ${o.phone}</b><b style="color:${o.status=='Cancel Requested'?'orange':'#e91e63'}">${o.status}</b></div><div style="margin:6px 0"><b>${o.productName}</b> - Rs${o.total}</div><div style="font-size:11px;color:#666">${o.id}<br>${new Date(o.date).toLocaleString()}</div>${box}<div style="margin-top:8px;display:flex;gap:6px"><select onchange="setS('${o.id}',this.value)" style="width:auto"><option ${o.status=='Pending'?'selected':''}>Pending</option><option ${o.status=='Packed'?'selected':''}>Packed</option><option ${o.status=='Shipped'?'selected':''}>Shipped</option><option ${o.status=='Delivered'?'selected':''}>Delivered</option><option ${o.status=='Cancelled'?'selected':''}>Cancelled</option></select><button onclick="window.open('https://wa.me/91${o.phone}?text=Order ${o.id} ${o.status}')" style="background:#25D366;color:#fff">WhatsApp</button><button onclick="del('${o.id}')" style="background:#fff;color:red;border:1px solid red">Delete</button></div></div>`;}).join('');
}
function setS(id,s){let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]');let o=all.find(x=>x.id==id);if(o){o.status=s;localStorage.setItem('umas_orders_new',JSON.stringify(all));load();}}
function del(id){if(!confirm('Delete?'))return;let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]');all=all.filter(x=>x.id!=id);localStorage.setItem('umas_orders_new',JSON.stringify(all));load();}
function approveCancel(id){if(!confirm('Approve cancellation?'))return;let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]');let o=all.find(x=>x.id==id);if(o){o.status='Cancelled';localStorage.setItem('umas_orders_new',JSON.stringify(all));load();alert('Approved - Cancelled');}}
function rejectCancel(id){if(!confirm('Reject cancellation? Order will continue'))return;let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]');let o=all.find(x=>x.id==id);if(o){o.status=o.prevStatus||'Pending';localStorage.setItem('umas_orders_new',JSON.stringify(all));load();alert('Rejected - Order Continues');}}
load();
</script></body></html>
