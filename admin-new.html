<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin NEW</title>
<style>body{font-family:system-ui;background:#f2f2f7;margin:0;padding:14px}.card{background:#fff;border-radius:16px;padding:16px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;box-sizing:border-box}button.main{background:#e91e63;color:#fff;border:0;padding:14px;width:100%;border-radius:10px;font-weight:800}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.p{background:#fff;border-radius:12px;padding:8px}.p img{width:100%;height:140px;object-fit:cover;border-radius:8px}</style></head>
<body>
<h2>Admin NEW - Edit + 3 Images + Video</h2>
<div class="card">
<input id="name" placeholder="Name">
<input id="price" type="number" placeholder="Our Price ₹">
<input id="mrp" type="number" placeholder="MRP ₹">
<select id="cat"><option>Sarees</option><option>Mens</option><option>Electronics</option><option>Home</option><option>Others</option></select>
<input id="img1" placeholder="Image 1 - Main (required)">
<input id="img2" placeholder="Image 2 - optional">
<input id="img3" placeholder="Image 3 - optional">
<input id="video" placeholder="Video - YouTube link or mp4 optional">
<button class="main" id="mainBtn" onclick="save()">Add LIVE</button>
<button id="cancelBtn" style="display:none;width:100%;margin-top:8px;padding:12px;background:#eee;border:0;border-radius:10px" onclick="cancelEdit()">Cancel Edit</button>
</div>
<h3>Products (<span id="count">0</span>)</h3>
<div id="list" class="products"></div>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||localStorage.getItem('products')||'[]');
let editId=null;
function save(){
 let n=name.value.trim(), p=+price.value, m=+mrp.value||p, c=cat.value, i1=img1.value.trim(), i2=img2.value.trim(), i3=img3.value.trim(), v=video.value.trim();
 if(!n||!p||!i1){alert('Need Name, Our Price, Image1');return;}
 if(editId){let idx=products.findIndex(x=>x.id===editId); products[idx]={id:editId,name:n,price:p,mrp:m,cat:c,images:[i1,i2,i3].filter(Boolean),video:v}; editId=null; mainBtn.textContent='Add LIVE'; cancelBtn.style.display='none';}
 else{products.unshift({id:Date.now(),name:n,price:p,mrp:m,cat:c,images:[i1,i2,i3].filter(Boolean),video:v});}
 ['name','price','mrp','img1','img2','img3','video'].forEach(id=>document.getElementById(id).value='');
 localStorage.setItem('umas_products',JSON.stringify(products)); localStorage.setItem('products',JSON.stringify(products)); render();
}
function editProduct(id){let pr=products.find(x=>x.id===id); name.value=pr.name; price.value=pr.price; mrp.value=pr.mrp; cat.value=pr.cat; img1.value=pr.images[0]||''; img2.value=pr.images[1]||''; img3.value=pr.images[2]||''; video.value=pr.video||''; editId=id; mainBtn.textContent='Update Product'; cancelBtn.style.display='block'; scrollTo(0,0);}
function cancelEdit(){editId=null; mainBtn.textContent='Add LIVE'; cancelBtn.style.display='none'; ['name','price','mrp','img1','img2','img3','video'].forEach(id=>document.getElementById(id).value='');}
function delProduct(id){if(confirm('Delete?')){products=products.filter(x=>x.id!==id); localStorage.setItem('umas_products',JSON.stringify(products)); localStorage.setItem('products',JSON.stringify(products)); render();}}
function render(){count.textContent=products.length; list.innerHTML=products.map(pr=>`<div class="p"><img src="${pr.images[0]}"><div style="font-weight:700">${pr.name}</div><div style="font-size:12px">Our ₹${pr.price} <s>₹${pr.mrp}</s></div><div style="margin-top:6px"><button onclick="editProduct(${pr.id})" style="background:#1a73e8;color:#fff;border:0;padding:6px 10px;border-radius:6px">Edit</button> <button onclick="delProduct(${pr.id})" style="background:#222;color:#fff;border:0;padding:6px 10px;border-radius:6px">Delete</button></div></div>`).join('');}
render();
</script>
</body></html>
