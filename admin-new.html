<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umas.India Admin NEW</title>
<style>body{font-family:system-ui;background:#f2f2f7;margin:0;padding:16px}.card{background:#fff;border-radius:20px;padding:20px}input,select{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;margin-bottom:12px;font-size:16px;box-sizing:border-box}button.main{background:#e91e63;color:#fff;border:0;padding:16px;width:100%;border-radius:12px;font-weight:800}</style></head>
<body><h1>Umas.India Admin (NEW)</h1>
<div class="card">
<input id="name" placeholder="Name">
<input id="price" type="number" placeholder="Price">
<input id="mrp" type="number" placeholder="MRP">
<select id="cat"><option>Sarees</option><option>Mens</option><option>Electronics</option><option>Home</option><option>Others</option></select>
<input id="img1" placeholder="Image URL 1 - Main (required)">
<input id="img2" placeholder="Image URL 2 - Optional">
<input id="img3" placeholder="Image URL 3 - Optional">
<input id="video" placeholder="Video URL - YouTube or mp4 - Optional">
<button class="main" onclick="addProduct()">Add LIVE</button>
</div>
<h2>Products (<span id="count">0</span>)</h2><div id="list" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]');
function save(){localStorage.setItem('umas_products',JSON.stringify(products));render();}
function addProduct(){const n=name.value.trim(),p=price.value,m=mrp.value,c=cat.value,i1=img1.value.trim(),i2=img2.value.trim(),i3=img3.value.trim(),v=video.value.trim();if(!n||!p||!i1){alert('Need Name, Price, Image1');return;}products.unshift({id:Date.now(),name:n,price:+p,mrp:m?+m:+p,cat:c,images:[i1,i2,i3].filter(Boolean),video:v});['name','price','mrp','img1','img2','img3','video'].forEach(id=>document.getElementById(id).value='');save();}
function del(id){if(confirm('Delete?')){products=products.filter(x=>x.id!==id);save();}}
function render(){count.textContent=products.length;list.innerHTML=products.map(pr=>`<div style="background:#fff;border-radius:16px;padding:10px"><img src="${pr.images[0]}" style="width:100%;height:160px;object-fit:cover;border-radius:10px"><div style="font-weight:700;margin-top:6px">${pr.name} ₹${pr.price}</div><button onclick="del(${pr.id})" style="width:100%;margin-top:8px;padding:10px;background:#222;color:#fff;border:0;border-radius:10px">Delete</button></div>`).join('');}render();
</script></body></html>
