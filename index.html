<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umas.India</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f7f7f7}
.header{background:#e91e63;color:#fff;text-align:center;padding:18px 10px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover;background:#eee}
.card-body{padding:10px}
.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:8px;border-radius:6px;margin-top:6px;font-weight:bold}
.track{background:#fff;margin:12px;padding:15px;border-radius:12px}
.track input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.track button{width:100%;padding:12px;background:#e91e63;color:#fff;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>Umas.India</h1>
<p>Owner: Umaswara | 7989333257<br>UPI: 7989333257@ybl</p>
<button onclick="document.getElementById('trackBox').scrollIntoView({behavior:'smooth'})">📦 Track My Order</button>
</div>

<div id="products" class="products"></div>

<div id="trackBox" class="track">
<h3>📦 Track My Order</h3>
<input id="phone" placeholder="Enter Phone e.g. 90******11">
<button onclick="track()">Track Now</button>
<div id="result" style="margin-top:10px"></div>
</div>

<div style="text-align:center;padding:20px"><a href="admin.html" style="color:#e91e63;font-size:12px">Admin Login</a></div>

<script>
let defaultProducts = [
{id:1,name:"Kanchi Blue Saree",price:100,oldPrice:108,cat:"Sarees",images:["https://images.unsplash.com/photo-1610030469983-98e550d6193a?w=600"]},
{id:2,name:"Kanchi Green Saree",price:120,oldPrice:150,cat:"Sarees",images:["https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600"]}
];
let products = JSON.parse(localStorage.getItem('umas_products')||'null');
if(!products || products.length==0 || products[0].name.includes('Pigeon')){
 products = defaultProducts;
 localStorage.setItem('umas_products', JSON.stringify(products));
}
function render(){
 document.getElementById('products').innerHTML = products.map(p=>`<div class="card"><img src="${p.images[0]}"><div class="card-body"><b>${p.name}</b><br><small>${p.cat||'Sarees'}</small><div><b>₹${p.price}</b> <s style="font-size:11px;color:#999">₹${p.oldPrice||''}</s></div><button class="btn" onclick="addCart(${p.id})">Add to Cart</button></div></div>`).join('');
}
let cart=JSON.parse(localStorage.getItem('umas_cart')||'[]');
function addCart(id){let f=cart.find(x=>x.id==id);if(f)f.qty++;else cart.push({...products.find(x=>x.id==id),qty:1});localStorage.setItem('umas_cart',JSON.stringify(cart));alert('Added!');}
function track(){let ph=document.getElementById('phone').value.trim();if(!ph)return alert('Enter phone');let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]');let found=orders.filter(o=>o.phone==ph);let r=document.getElementById('result');if(found.length==0)r.innerHTML=`<p style="color:red">No orders for ${ph.substring(0,2)}******${ph.slice(-2)}</p>`;else r.innerHTML=found.map(o=>`<div style="border:1px solid #ddd;padding:8px;border-radius:8px;margin:5px 0">Order #${o.id} - ₹${o.total}</div>`).join('');}
render();
</script>
</body>
</html>
