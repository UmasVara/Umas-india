<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umas.India</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.header{background:#e91e63;color:#fff;text-align:center;padding:18px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:10px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:8px}
.card-body b{font-size:14px;display:block}
.price{font-weight:bold;margin-top:4px}
.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:8px;border-radius:6px;margin-top:6px}
.track{background:#fff;margin:10px;padding:15px;border-radius:10px}
.track input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
.track button{width:100%;padding:10px;background:#e91e63;color:#fff;border:0;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<h1>Umas.India</h1>
<p>Owner: Umaswara | 7989333257<br>UPI: 7989333257@ybl</p>
<a href="#trackBox"><button style="background:#fff;color:#e91e63;border:0;padding:8px 15px;border-radius:20px;margin-top:8px">📦 Track My Order</button></a>
</div>
<div id="products" class="products"></div>
<div id="trackBox" class="track">
<h3>📦 Track My Order</h3>
<input id="phone" placeholder="90******11">
<button onclick="track()">Track Now</button>
<div id="result"></div>
</div>
<center style="padding:15px"><a href="admin.html" style="color:#e91e63;font-size:12px">Admin</a></center>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]');
if(products.length==0){
products=[{id:1,name:"Kanchi Blue Saree",price:100,mrp:108,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193a?w=600"},{id:2,name:"Kanchi Green Saree",price:120,mrp:150,img:"https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600"}];
localStorage.setItem('umas_products',JSON.stringify(products));
}
function show(){
document.getElementById('products').innerHTML=products.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><b>${p.name}</b><div class="price">₹${p.price} <s style="color:#999;font-size:11px">₹${p.mrp}</s></div><button class="btn">Add to Cart</button></div></div>`).join('');
}
function track(){
let ph=document.getElementById('phone').value;
if(!ph)return alert('Enter phone');
document.getElementById('result').innerHTML='No orders for '+ph;
}
show();
</script>
</body>
</html>
