<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umas.India</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#fff}.top{background:#e91e63;color:#fff;text-align:center;padding:15px}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.prod{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.1)}.prod img{width:100%;height:180px;object-fit:cover}.prod-info{padding:8px}</style>
</head>
<body>
<div class="top"><h1>Umas.India</h1><small>Owner: Umaswara | 7989333257</small><br><button onclick="document.getElementById('trackBox').scrollIntoView({behavior:'smooth'})" style="margin-top:8px;padding:6px 12px;border-radius:20px;border:0;background:#fff;color:#e91e63;font-weight:bold">Track My Order</button></div>
<div id="products" class="products"></div>
<div id="trackBox" style="margin:10px;padding:15px;border:1px solid #eee;border-radius:10px"><h3>📦 Track</h3><input id="trackPhone" placeholder="90******11" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button onclick="trackOrder()" style="width:100%;padding:10px;background:#e91e63;color:#fff;border:0;border-radius:8px;margin-top:8px">Track Now</button><div id="trackResult"></div></div>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]');
document.getElementById('products').innerHTML=products.map(p=>`<div class="prod"><img src="${p.images[0]}"><div class="prod-info"><b>${p.name}</b><br>₹${p.price}</div></div>`).join('');
function trackOrder(){let ph=document.getElementById('trackPhone').value; let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]'); let f=orders.filter(o=>o.phone==ph); document.getElementById('trackResult').innerHTML=f.length?f.map(o=>`Order #${o.id} - ₹${o.total}`).join('<br>'):`No orders for ${ph.substring(0,2)}******${ph.slice(-2)}`;}
</script>
</body>
</html>
