<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Umas.India</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding:10px}
.header{background:#000;color:#fff;padding:15px;border-radius:10px;text-align:center}
.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
select{padding:6px;border-radius:6px;border:1px solid #ccc}
.btn{padding:6px 12px;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-del{background:#ffebee;color:red;border:1px solid red}
.btn-wa{background:#25D366;color:#fff}
</style>
</head>
<body>

<div class="header">
<h2>Admin Panel - Umas.India</h2>
<p>Owner: 7989333257</p>
<a href="index.html" style="color:#fff;text-decoration:underline">Go to Shop</a>
</div>

<div style="background:#fff;padding:10px;border-radius:10px;margin-top:10px;display:flex;gap:10px">
<input id="search" type="tel" placeholder="Search by phone..." style="flex:1;padding:10px;border:1px solid #ccc;border-radius:8px" oninput="loadOrders()">
<button onclick="loadOrders()" style="background:#e91e63;color:#fff;border:0;padding:10px 15px;border-radius:8px">Search</button>
<button onclick="clearAll()" style="background:#000;color:#fff;border:0;padding:10px 15px;border-radius:8px">Clear All</button>
</div>

<div id="orders"></div>

<script>
function loadOrders(){
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let s = document.getElementById('search').value.trim();
  if(s) all = all.filter(o=>String(o.phone).includes(s));
  
  if(all.length==0){
    document.getElementById('orders').innerHTML='<p style="text-align:center;padding:30px">No orders found<br><small>Orders will appear here when buyer places order with phone number</small></p>';
    return;
  }

  document.getElementById('orders').innerHTML = all.reverse().map(o=>{
    let cleanName = (o.productName || 'Saree').replace(/undefined/g,'');
    let total = o.total || 108;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between"><b>📱 ${o.phone}</b><b style="color:#e91e63">${o.status||'Pending'}</b></div>
      <div style="margin:8px 0"><b>${cleanName}</b> x1 - ₹${total}</div>
      <div style="font-size:12px;color:#666">Order ID: ${o.id}<br>Date: ${new Date(o.date).toLocaleString()}</div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <select onchange="changeStatus('${o.id}',this.value)">
          <option ${o.status=='Pending'?'selected':''}>Pending</option>
          <option ${o.status=='Packed'?'selected':''}>Packed</option>
          <option ${o.status=='Shipped'?'selected':''}>Shipped</option>
          <option ${o.status=='Delivered'?'selected':''}>Delivered</option>
          <option ${o.status=='Cancelled'?'selected':''}>Cancelled</option>
        </select>
        <button class="btn btn-wa" onclick="window.open('https://wa.me/91${o.phone}?text=Hi, Your order ${cleanName} is ${o.status}','_blank')">WhatsApp Buyer</button>
        <button class="btn btn-del" onclick="deleteOrder('${o.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function changeStatus(id,status){
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let o = all.find(x=>x.id==id);
  if(o){ o.status=status; localStorage.setItem('umas_orders', JSON.stringify(all)); loadOrders(); }
}
function deleteOrder(id){
  if(!confirm('Delete this order?')) return;
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  all = all.filter(x=>x.id!=id);
  localStorage.setItem('umas_orders', JSON.stringify(all));
  loadOrders();
}
function clearAll(){
  if(!confirm('Delete ALL orders?')) return;
  localStorage.removeItem('umas_orders');
  loadOrders();
}
loadOrders();
</script>
</body>
</html>
