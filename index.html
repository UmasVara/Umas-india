<!DOCTYPE html>
<html>

<style>

body{background:#f5f5f5}
.header{background:#e91e63;color:#fff;text-align:center;padding:18px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:8px}
.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:9px;border-radius:6px;margin-top:6px;font-weight:bold}
.track{background:#fff;margin:10px;padding:15px;border-radius:12px}
.track input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.track button{width:100%;padding:12px;background:#e91e63;color:#fff;border:0;border-radius:8px;margin-top:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>Umas.India</h1>
<p>Owner: Umaswara | 7989333257<br>UPI: 7989333257@ybl</p>
<a href="#trackBox"><button style="background:#fff;color:#e91e63;border:0;padding:8px 15px;border-radius:20px;margin-top:8px">📦 Track My Order</button></a>
</div>

<div class="products">
  <div class="card">
    <img src="https://images.pexels.com/photos/7679720/pexels-photo-7679720.jpeg?auto=compress&cs=tinysrgb&w=400">

    </div>
  </div>
  <div class="card">

      <b>Kanchi Green Saree</b>

    </div>
  </div>

<input id="phone" placeholder="90******11">
