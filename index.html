<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Umas.India</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e91e63">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root{
      --bg:#f4f4f4;
      --card:#fff;
      --text:#111;
      --muted:#666;
      --header:#e91e63;
      --button:#e91e63;
      --darkbg:#111;
      --darkcard:#1a1a1a;
      --darktext:#fff;
      --darkmuted:#ddd;
      --border:#eee;
      --inputbg:#fff;
      --inputtext:#111;
    }

    body{
      margin:0;
      font-family:system-ui, Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      transition:0.3s ease;
    }

    body.dark{
      background:#0f0f0f;
      color:var(--darktext);
    }

    .header{
      background:var(--header);
      color:#fff;
      text-align:center;
      padding:18px 12px 14px;
      position:sticky;
      top:0;
      z-index:20;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }

    .header h1{
      margin:0;
      font-size:28px;
      cursor:pointer;
      user-select:none;
    }

    .header p{
      margin:6px 0 0;
      font-size:13px;
      line-height:1.5;
    }

    .trackBtn{
      background:#fff;
      color:#e91e63;
      border:none;
      padding:8px 18px;
      border-radius:20px;
      font-weight:bold;
      margin-top:10px;
      cursor:pointer;
    }

    #secretAdminBtn{
      display:none;
      background:#000;
      color:#fff;
      border:none;
      padding:8px 22px;
      border-radius:20px;
      margin-top:10px;
      font-weight:bold;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      padding:12px;
      background:#fff;
      border-bottom:1px solid var(--border);
      position:sticky;
      top:90px;
      z-index:15;
    }

    body.dark .toolbar{
      background:#1a1a1a;
      border-color:#333;
    }

    .toolbar input, .toolbar select{
      padding:12px 14px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:15px;
      background:var(--inputbg);
      color:var(--inputtext);
      outline:none;
    }

    #themeToggle{
      padding:12px 16px;
      border:none;
      border-radius:10px;
      background:#111;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }

    body.dark #themeToggle{
      background:#fff;
      color:#111;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      padding:12px;
      padding-bottom:100px;
    }

    .card{
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
      background:var(--card);
      border:1px solid #f0f0f0;
    }

    body.dark .card{
      background:var(--darkcard);
      border-color:#222;
    }

    .card img{
      width:100%;
      height:200px;
      object-fit:cover;
      cursor:pointer;
    }

    .card-body{
      padding:10px;
      color:var(--text);
    }

    body.dark .card-body{
      color:var(--darktext);
    }

    .buy{
      background:var(--button);
      color:#fff;
      border:none;
      width:100%;
      padding:10px;
      border-radius:8px;
      font-weight:bold;
      margin-top:8px;
      cursor:pointer;
    }

    .buy.secondary{
      background:#333;
      margin-top:8px;
    }

    #cartBtn{
      position:fixed;
      bottom:20px;
      right:20px;
      background:#e91e63;
      color:#fff;
      border:none;
      padding:15px 20px;
      border-radius:50px;
      font-weight:bold;
      box-shadow:0 4px 15px rgba(0,0,0,.3);
      z-index:30;
      cursor:pointer;
    }

    #checkoutModal,#trackModal,#productModal,#adminPanel{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,.72);
      z-index:40;
      overflow-y:auto;
    }

    .modalBox{
      background:#fff;
      color:#111;
      max-width:480px;
      margin:24px auto;
      padding:20px;
      border-radius:15px;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }

    body.dark .modalBox{
      background:#1d1d1d;
      color:#fff;
    }

    .modalBox input, .modalBox textarea, .modalBox select{
      width:92%;
      padding:12px;
      margin:8px 0;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      background:#fff;
      color:#111;
    }

    body.dark .modalBox input,
    body.dark .modalBox textarea,
    body.dark .modalBox select{
      background:#111;
      color:#fff;
      border-color:#333;
    }

    .payOption{
      display:block;
      padding:12px;
      margin:8px 0;
      border-radius:10px;
      border:2px solid #ddd;
      cursor:pointer;
      color:#111;
    }

    body.dark .payOption{
      color:#fff;
      border-color:#444;
      background:#222 !important;
    }

    .payOption:has(input:checked){
      border-color:#e91e63;
      background:#fce4ec;
    }

    .qtyBtn{
      border:1px solid #ccc;
      background:#fff;
      color:#111;
      padding:3px 8px;
      border-radius:4px;
      cursor:pointer;
      font-weight:bold;
    }

    .removeBtn{
      background:#ff1744;
      color:#fff;
      border:none;
      padding:5px 8px;
      border-radius:4px;
      cursor:pointer;
      font-size:12px;
    }

    .adminSection{
      max-width:1100px;
      margin:18px auto 80px;
      padding:16px;
      display:none;
      background:#fff;
      border-radius:16px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }

    body.dark .adminSection{
      background:#171717;
      color:#fff;
    }

    .adminForm{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:10px;
      margin-bottom:20px;
    }

    .adminForm input, .adminForm select{
      padding:12px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:14px;
      width:100%;
      box-sizing:border-box;
    }

    .adminForm button{
      padding:12px;
      border:none;
      border-radius:10px;
      background:#e91e63;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }

    .adminList{
      display:grid;
      gap:12px;
    }

    .adminRow{
      border:1px solid #eee;
      border-radius:12px;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      background:#fafafa;
    }

    body.dark .adminRow{
      background:#1f1f1f;
      border-color:#2a2a2a;
    }

    .statusBtn{
      padding:8px 14px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    .hiddenProduct{
      opacity:0.6;
      border-style:dashed;
    }

    .paymentSettings{
      margin-top:18px;
      padding:16px;
      border:1px solid #eee;
      border-radius:12px;
      background:#fafafa;
    }

    body.dark .paymentSettings{
      background:#1f1f1f;
      border-color:#2a2a2a;
    }

    .paymentToggleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:12px 0;
      padding:10px 12px;
      border-radius:8px;
      background:#fff;
    }

    body.dark .paymentToggleRow{
      background:#111;
    }

    .paymentToggleRow label{
      font-weight:bold;
    }

    .paymentToggleRow input{
      transform: scale(1.3);
    }

    @media (max-width: 700px){
      .grid{
        grid-template-columns:1fr;
      }
      .toolbar{
        top:96px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="mainTitle">Umas.India</h1>
    <p>Owner: Umasvara | 7989333257<br>UPI: 7989333257@ybl</p>
    <button class="trackBtn" onclick="openTrack()">📦 Track My Order</button>
    <button id="secretAdminBtn" onclick="checkAdmin()">Admin</button>
  </div>

  <div class="toolbar">
    <input id="searchInput" placeholder="Search products..." />
    <select id="categoryFilter">
      <option value="all">All</option>
    </select>
    <button id="themeToggle" onclick="toggleTheme()">🌙</button>
  </div>

  <div id="products" class="grid"></div>

  <button id="cartBtn" onclick="openCheckout()">🛒 Cart (<span id="cartCount">0</span>)</button>

  <div id="adminPanel" class="adminSection">
    <h2 style="margin-top:0;">Admin Panel</h2>

    <div class="adminForm">
      <input id="adminName" placeholder="Product name">
      <input id="adminCategory" placeholder="Category">
      <input id="adminPrice" type="number" min="1" placeholder="Price">
      <input id="adminMrp" type="number" min="1" placeholder="MRP">
      <input id="adminImage" placeholder="Image URL">
      <input id="adminDesc" placeholder="Description">
      <button onclick="addProduct()">Add Product</button>
    </div>

    <div class="paymentSettings">
      <h3 style="margin-top:0;">Payment Options</h3>

      <div class="paymentToggleRow">
        <label for="codToggle">Cash on Delivery</label>
        <input id="codToggle" type="checkbox" checked>
      </div>

      <div class="paymentToggleRow">
        <label for="upiToggle">UPI</label>
        <input id="upiToggle" type="checkbox" checked>
      </div>

      <div class="paymentToggleRow">
        <label for="whatsappToggle">WhatsApp Order</label>
        <input id="whatsappToggle" type="checkbox" checked>
      </div>

      <button onclick="savePaymentSettings()" style="width:100%;background:#e91e63;color:#fff;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">Save Payment Settings</button>
    </div>

    <div class="adminList" id="adminList"></div>
  </div>

  <div id="checkoutModal">
    <div class="modalBox">
      <h2 style="margin-top:0;color:#e91e63;">Checkout</h2>
      <button onclick="closeCheckout()" style="float:right;background:#000;color:#fff;border:none;padding:5px 10px;border-radius:5px;">X</button>
      <div style="clear:both"></div>

      <div id="cartItems"></div>
      <h3>Total: ₹<span id="totalAmt">0</span></h3>

      <input id="custName" placeholder="Your Full Name *">
      <input id="custPhone" placeholder="Phone Number *">
      <textarea id="custAddress" placeholder="Full Delivery Address *"></textarea>

      <h3>💳 Payment</h3>
      <div id="paymentOptionsContainer"></div>

      <button onclick="placeOrder()" style="width:100%;background:#e91e63;color:#fff;padding:16px;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:15px;">✅ Place My Order</button>
    </div>
  </div>

  <div id="trackModal">
    <div class="modalBox">
      <h2 style="color:#e91e63;margin-top:0;">📦 Track Your Orders</h2>
      <button onclick="closeTrack()" style="float:right;background:#000;color:#fff;border:none;padding:5px 10px;border-radius:5px;">X</button>
      <div style="clear:both"></div>

      <input id="trackPhone" placeholder="Enter Phone e.g. 90******11">
      <button onclick="trackOrders()" style="width:100%;background:#4caf50;color:#fff;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:8px;">🔍 Check Status</button>

      <div id="trackResult" style="margin-top:15px;"></div>
    </div>
  </div>

  <div id="productModal">
    <div class="modalBox">
      <button onclick="closeProductModal()" style="float:right;background:#000;color:#fff;border:none;padding:5px 10px;border-radius:5px;">X</button>
      <div style="clear:both"></div>
      <img id="modalImage" style="width:100%;height:220px;object-fit:cover;border-radius:12px;">
      <h2 id="modalName" style="margin:12px 0 8px;color:#e91e63;"></h2>
      <p id="modalDesc" style="margin:0 0 10px;"></p>
      <h3 id="modalPrice" style="margin:0 0 10px;"></h3>
      <button onclick="addToCartFromModal()" style="width:100%;background:#e91e63;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:bold;">Add to Cart</button>
      <button onclick="buyNowFromModal()" style="width:100%;background:#333;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:8px;">Buy Now</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA2CKqJnhdVijyCmrJPrxP21fVhIQI9LWk",
      authDomain: "umasindia-4cd69.firebaseapp.com",
      projectId: "umasindia-4cd69",
      storageBucket: "umasindia-4cd69.firebasestorage.app",
      messagingSenderId: "441625672930",
      appId: "1:441625672930:web:0e80f6a292950d6dbd72bb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let products = [];
    let cart = JSON.parse(localStorage.getItem('umas_cart') || '[]');
    let selectedProduct = null;
    let searchText = "";
    let selectedCategory = "all";
    let isAdmin = false;
    let darkMode = localStorage.getItem("umas_dark") === "true";

    const defaultPaymentOptions = {
      cod: true,
      upi: true,
      whatsapp: true
    };

    let paymentOptions = JSON.parse(localStorage.getItem("umas_payment_options") || "null") || { ...defaultPaymentOptions };

    function loadProducts() {
      db.collection("products")
        .orderBy("date", "desc")
        .onSnapshot((snapshot) => {
          products = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            products.push({ ...data, id: doc.id });
          });

          setupCategoryFilter();
          render();
          renderAdminPanel();
        });
    }

    function setupCategoryFilter() {
      const categories = [...new Set(products.map(p => (p.category || "General").trim()).filter(Boolean))];
      const select = document.getElementById("categoryFilter");
      select.innerHTML = '<option value="all">All</option>';
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });

      if (categories.includes(selectedCategory)) {
        select.value = selectedCategory;
      } else {
        selectedCategory = "all";
        select.value = "all";
      }
    }

    function render() {
      const list = document.getElementById("products");
      const filtered = products.filter((p) => {
        const visible = p.visible !== false;
        if (!visible && !isAdmin) return false;

        const search = (searchText || "").toLowerCase();
        const matchesSearch = !search || `${p.name || ""} ${p.category || ""}`.toLowerCase().includes(search);
        const matchesCategory = selectedCategory === "all" || (p.category || "General") === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      let html = "";
      filtered.forEach((p) => {
        html += `
          <div class="card ${p.visible === false ? 'hiddenProduct' : ''}">
            <img src="${p.image || p.img || 'https://via.placeholder.com/600x400?text=Product'}" onclick="openProductModal('${p.id}')">
            <div class="card-body">
              <b>${p.name || "Unnamed product"}</b><br>
              ₹${p.price || 0} <s>₹${p.mrp || ""}</s><br>
              <small>${p.category || "General"}</small><br>
              <div style="margin-top:8px;">${p.description || ""}</div>
              <button class="buy" onclick="openProductModal('${p.id}')">View Details</button>
              <button class="buy secondary" onclick="buyNow('${p.id}')">Buy Now</button>
            </div>
          </div>
        `;
      });

      if (filtered.length === 0) {
        html = `<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:${document.body.classList.contains('dark') ? '#ddd' : '#555'};">No products found</div>`;
      }

      list.innerHTML = html;
      updateCartCount();
    }

    function addToCart(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;

      let found = cart.find(item => item.name === p.name);
      if (found) {
        found.qty += 1;
      } else {
        cart.push({ name: p.name, price: p.price, qty: 1 });
      }

      localStorage.setItem("umas_cart", JSON.stringify(cart));
      updateCartCount();
      alert(p.name + " added to cart!");
    }

    function updateCartCount() {
      const total = cart.reduce((sum, item) => sum + Number(item.qty || 0), 0);
      document.getElementById("cartCount").innerText = total;
    }

    function openCheckout() {
      if (cart.length === 0) {
        alert("Cart is empty");
        return;
      }

      renderCheckoutItems();
      renderPaymentOptions();
      document.getElementById("checkoutModal").style.display = "block";
    }

    function closeCheckout() {
      document.getElementById("checkoutModal").style.display = "none";
    }

    function renderCheckoutItems() {
      let html = "";
      let total = 0;

      cart.forEach((c, idx) => {
        const itemTotal = Number(c.price || 0) * Number(c.qty || 1);
        total += itemTotal;

        html += `
          <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:10px 0;">
            <div>
              <b>${c.name}</b><br>
              <button class="qtyBtn" onclick="changeQty(${idx}, -1)">-</button>
              ${c.qty}
              <button class="qtyBtn" onclick="changeQty(${idx}, 1)">+</button>
              ₹${itemTotal}
            </div>
            <button class="removeBtn" onclick="removeItem(${idx})">Remove</button>
          </div>
        `;
      });

      document.getElementById("cartItems").innerHTML = html;
      document.getElementById("totalAmt").innerText = total;
    }

    function changeQty(i, d) {
      cart[i].qty += d;
      if (cart[i].qty <= 0) {
        cart.splice(i, 1);
      }
      saveCart();
    }

    function removeItem(i) {
      cart.splice(i, 1);
      saveCart();
    }

    function saveCart() {
      localStorage.setItem("umas_cart", JSON.stringify(cart));
      if (cart.length === 0) {
        closeCheckout();
        render();
        return;
      }
      renderCheckoutItems();
      updateCartCount();
    }

    function openTrack() {
      document.getElementById("trackModal").style.display = "block";
    }

    function closeTrack() {
      document.getElementById("trackModal").style.display = "none";
    }

    function openProductModal(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      selectedProduct = p;

      document.getElementById("modalImage").src = p.image || p.img || "https://via.placeholder.com/600x400?text=Product";
      document.getElementById("modalName").innerText = p.name;
      document.getElementById("modalDesc").innerText = p.description || "Premium product";
      document.getElementById("modalPrice").innerText = "₹" + (p.price || 0);

      document.getElementById("productModal").style.display = "block";
    }

    function closeProductModal() {
      document.getElementById("productModal").style.display = "none";
    }

    function addToCartFromModal() {
      if (!selectedProduct) return;
      addToCart(selectedProduct.id);
      closeProductModal();
    }

    function buyNow(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      cart = [{ name: p.name, price: p.price, qty: 1 }];
      localStorage.setItem("umas_cart", JSON.stringify(cart));
      updateCartCount();
      openCheckout();
    }

    function buyNowFromModal() {
      if (!selectedProduct) return;
      buyNow(selectedProduct.id);
      closeProductModal();
    }

    function renderPaymentOptions() {
      const container = document.getElementById("paymentOptionsContainer");
      const en
