<button id="secretAdminBtn" style="display:none; background:black; color:white; padding:8px 20px; border-radius:20px; border:none; margin-top:8px;" onclick="checkAdmin()">Admin</button>
<p style="font-size:10px; opacity:0.6;">Tap title 3 times for Admin</p>

<script>
let taps = 0;
document.getElementById('mainTitle').addEventListener('click', function(){
  taps++;
  if(taps >= 3){
    document.getElementById('secretAdminBtn').style.display='inline-block';
    setTimeout(()=>{document.getElementById('secretAdminBtn').style.display='none'; taps=0;},10000);
    taps=0;
  }
  setTimeout(()=>{taps=0;},2000);
});
function checkAdmin(){
  let p=prompt("Enter Admin Password:");
  if(p==="Business@1008"){window.location.href="admin.html";}
  else if(p!==null){alert("Wrong Password!"); document.getElementById('secretAdminBtn').style.display='none';}
}
</script>
