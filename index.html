<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umas.India</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5}
.header{background:#e91e63;color:#fff;text-align:center;padding:20px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden}
.card img{width:100%;height:210px;object-fit:cover}
.card-body{padding:10px}
.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:10px;border-radius:8px;margin-top:6px;font-weight:bold}
.track-box{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:15px;max-height:85vh;overflow:auto;display:none;z-index:999}
.order-card{border-left:5px solid #e91e63;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
</style>
</head>
<body>

<div class="header">
<h2>Umas.India</h2>
<p style="font-size:13px">Owner: Umaswara | 7989333257<br>UPI: 7989333257@ybl</p>
<button onclick="document.getElementById('trackBox').style.display='block'" style="background:#fff;color:#e91e63;border:0;padding:10px 20px;border-radius:25px;margin-top:10px;font-weight:bold">📦 Track My Order</button>
</div>

<div class="products">
  <div class="card"><img src="https://images.pexels.com/photos/7679720/pexels-photo-7679720.jpeg?w=400"><div class="card-body"><b>Kanchi Blue Saree</b><br><b>₹100 <s style="color:#999">₹108</s></b><button class="btn" onclick="buyNow('Kanchi Blue Saree',100)">Add to Cart</button></div></div>
  <div class="card"><img src="https://images.pexels.com/photos/7679720/pexels-photo-7679720.jpeg?w=400"><div class="card-body"><b>Kanchi Green Saree</b><br><b>₹120 <s style="color:#999">₹150</s></b><button class="btn" onclick="buyNow('Kanchi Green Saree',120)">Add to Cart</button></div></div>
</div>

<div id="trackBox" class="track-box">
  <div style="display:flex;justify-content:space-between"><h2 style="color:#e91e63">📦 Track Your Orders</h2><button onclick="this.parentElement.parentElement.style.display='none'" style="background:#000;color:#fff;border:0;width:30px;height:30px;border-radius:8px">X</button></div>
  <input id="phone" type="tel" placeholder="Enter YOUR phone number" style="width:100%;padding:14px;border-radius:10px;border:1px solid #ccc;margin:15px 0">
  <button onclick="check()" style="width:100%;background:#e91e63;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:bold">🔍 Check Status</button>
  <div id="orders" style="margin-top:15px"></div>
</div>

<script>
// Auto-clean old broken data once
(function(){
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let cleaned = all.filter(o=>{
    let s = JSON.stringify(o).toLowerCase();
    return !s.includes('undefined') && !s.includes('nan') && !s.includes('sunday, sunday') && !s.includes(', sunday');
  });
  if(all.length!=cleaned.length){
    localStorage.setItem('umas_orders', JSON.stringify(cleaned));
  }
})();

function buyNow(name,price){
  let ph = prompt('Enter your phone number:');
  if(!ph) return;
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let d = new Date(); let del = new Date(); del.setDate(d.getDate()+4);
  all.push({id:Date.now().toString(),phone:ph,productName:name,total:price,status:'Pending',date:d.toISOString(),dDay:del.toLocaleDateString('en-IN',{weekday:'long'}),dDate:del.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})});
  localStorage.setItem('umas_orders', JSON.stringify(all));
  alert('Order placed! Track with '+ph);
  document.getElementById('phone').value=ph;
  document.getElementById('trackBox').style.display='block';
  check();
}

function check(){
  let ph = document.getElementById('phone').value.trim();
  if(!ph) return alert('Enter phone');
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let my = all.filter(o=>String(o.phone)==ph);
  if(my.length==0){ document.getElementById('orders').innerHTML=`<p style="text-align:center">No orders for ${ph}</p>`; return; }
  document.getElementById('orders').innerHTML = my.reverse().map(o=>{
    let canCancel = o.status=='Pending' || o.status=='Packed';
    return `<div class="order-card"><div style="font-size:11px">Pending > Packed > Shipped > Delivered - <b style="color:#e91e63">${o.status}</b></div><b style="display:block;margin:8px 0">${o.productName} x1</b><div>₹${o.total} - <b style="color:#e91e63">${o.status}</b></div><div style="border:1px dashed green;background:#f0fff4;padding:10px;border-radius:8px;margin-top:10px;text-align:center">🚚 Delivery by<br><b style="color:green">${o.dDay}, ${o.dDate}</b></div>${canCancel?`<button onclick="cancelOrder('${o.id}')" style="margin-top:10px;background:#fff;color:red;border:1px solid red;padding:8px 18px;border-radius:20px;font-weight:bold;width:100%">❌ Cancel This Order</button>`:''}</div>`;
  }).join('');
}

function cancelOrder(id){
  if(!confirm('Cancel this order? Full refund in 24hrs')) return;
  let all = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let o = all.find(x=>x.id==id);
  o.status='Cancelled';
  localStorage.setItem('umas_orders', JSON.stringify(all));
  alert('Cancelled! Refund in 24hrs');
  check();
}
</script>
</body>
</html>
