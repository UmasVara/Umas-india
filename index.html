<!-- TRACK MODAL - CORRECT VERSION -->
<div id="trackModal" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:15px;max-height:90vh;overflow:auto;z-index:999;box-shadow:0 -5px 20px rgba(0,0,0,.3)">
  <div style="display:flex;justify-content:space-between">
    <h2 style="color:#e91e63">📦 Track Your Orders</h2>
    <button onclick="document.getElementById('trackModal').style.display='none'" style="background:#000;color:#fff;border:0;width:30px;height:30px;border-radius:8px">X</button>
  </div>
  
  <input id="buyerPhone" type="tel" placeholder="Enter YOUR phone number" style="width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;margin:15px 0;background:#f0f6ff">
  <button onclick="searchMyOrders()" style="width:100%;background:#4caf50;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:bold">🔍 Check Status</button>
  
  <div id="buyerOrders" style="margin-top:15px"></div>
</div>

<script>
function openTrack(){ document.getElementById('trackModal').style.display='block'; }

function searchMyOrders(){
  let phone = document.getElementById('buyerPhone').value.trim();
  if(!phone){ alert('Please enter your phone number'); return; }

  let allOrders = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  let myOrders = allOrders.filter(o => String(o.phone).trim() == phone);

  if(myOrders.length == 0){
    document.getElementById('buyerOrders').innerHTML = `<p style="text-align:center;padding:20px">No orders found for ${phone}<br>Please check number</p>`;
    return;
  }

  document.getElementById('buyerOrders').innerHTML = myOrders.reverse().map(o => {
    let canCancel = (o.status === 'Pending' || o.status === 'Packed');
    let isCancelled = o.status === 'Cancelled';
    
    // Fix your NaN / undefined bug
    let itemName = (o.productName || o.items?.[0]?.name || 'Saree').replace(/undefined/g,'').trim();
    let total = o.total || o.items?.[0]?.price || 108;

    return `
    <div style="background:#fff;border-left:5px solid ${isCancelled?'#999':'#e91e63'};border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)">
      <div style="font-size:12px;color:#666;display:flex;justify-content:space-between">
        <span>Pending > Packed > Shipped > Delivered</span>
        <b style="color:${isCancelled?'#999':'#e91e63'}">${o.status}</b>
      </div>
      <b style="display:block;margin:8px 0">${itemName} x1</b>
      <div>₹${total} - <b style="color:#e91e63">${o.status}</b></div>
      
      <div style="border:1px dashed green;padding:8px;border-radius:8px;margin-top:10px;text-align:center">
        🚚 Delivery by ${new Date(o.date).toDateString()}
      </div>

      ${canCancel ? `
        <button onclick="buyerCancelOrder('${o.id}','${phone}')" style="margin-top:12px;background:#fff;color:red;border:1px solid red;padding:8px 18px;border-radius:20px;font-weight:bold;cursor:pointer">❌ Cancel This Order</button>
        <p style="font-size:11px;color:#666;margin-top:4px">You can cancel before Shipped</p>
      ` : ''}

      ${isCancelled ? `<p style="color:red;margin-top:8px">❌ Cancelled - Refund in 24hrs</p>` : ''}
    </div>`;
  }).join('');
}

  let reason = prompt('Reason for cancel?','Ordered by mistake');

  let order = allOrders.find(o => o.id == orderId);
  if(order){
    order.status = 'Cancelled';
    order.cancelReason = reason;
    order.cancelAt = new Date().toLocaleString();
