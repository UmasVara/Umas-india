<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umas.India</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff}
.top{background:#e91e63;color:#fff;text-align:center;padding:15px}
.top h1{font-size:22px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.prod{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.1);cursor:pointer}
.prod img{width:100%;height:180px;object-fit:cover}
.prod-info{padding:8px}
#detail{position:fixed;inset:0;background:#fff;z-index:99;display:none;overflow:auto}
.slider{position:relative;height:350px;background:#fafafa;display:flex;overflow:hidden}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.slide img{max-width:100%;max-height:100%}
.slide iframe{width:100%;height:100%;border:0}
.dots{text-align:center;padding:8px}
.dot{display:inline-block;width:8px;height:8px;background:#ccc;border-radius:50%;margin:0 3px}
.dot.active{background:#e91e63;width:16px;border-radius:5px}
</style>
</head>
<body>
<div class="top">
<h1>Umas.India</h1>
<small>Owner: Umaswara | 7989333257<br>UPI: 7989333257@ybl</small><br>
<button onclick="document.getElementById('trackBox').scrollIntoView({behavior:'smooth'})" style="margin-top:8px;padding:6px 12px;border-radius:20px;border:0;background:#fff;color:#e91e63;font-weight:bold">📦 Track My Order</button>
</div>

<div id="products" class="products"></div>

<div id="trackBox" style="background:#fff;margin:10px;padding:15px;border-radius:10px;border:1px solid #eee">
<h3>📦 Track My Order</h3>
<input id="trackPhone" placeholder="Enter Phone e.g. 90******11" style="width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px">
<button onclick="trackOrder()" style="width:100%;padding:10px;background:#e91e63;color:#fff;border:0;border-radius:8px;font-weight:bold">Track Now</button>
<div id="trackResult" style="margin-top:10px"></div>
</div>

<div id="detail">
<div style="padding:10px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><b>Product Details</b><span onclick="closeDetail()" style="background:#eee;padding:5px 10px;border-radius:50%">✕</span></div>
<div class="slider" id="slider"></div>
<button onclick="moveSlide(-1)" style="position:absolute;top:180px;left:5px;padding:10px">‹</button>
<button onclick="moveSlide(1)" style="position:absolute;top:180px;right:5px;padding:10px">›</button>
<div class="dots" id="dots"></div>
<div style="padding:12px">
<h2 id="dTitle"></h2>
<p><b id="dPrice" style="color:#e91e63;font-size:20px"></b> <s id="dOld"></s></p>
<p>⭐ <span id="dRating"></span></p>
<b>HIGHLIGHTS</b><ul id="dHigh"></ul>
<b>Description</b><p id="dDesc"></p>
<button onclick="addFromDetail()" style="width:100%;padding:12px;background:#e91e63;color:#fff;border:0;border-radius:20px;font-weight:bold;margin-top:10px">Add to Cart</button>
</div>
</div>

<div id="cartBox" style="position:fixed;bottom:20px;right:15px;background:#e91e63;color:#fff;padding:10px 15px;border-radius:20px;cursor:pointer" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>

<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]');
let cart=JSON.parse(localStorage.getItem('umas_cart')||'[]');
let cur=null, cSlide=0, allSlides=[];

function render(){
 document.getElementById('products').innerHTML=products.map(p=>`<div class="prod" onclick="openDetail(${p.id})"><img src="${p.images[0]}"><div class="prod-info"><b>${p.name}</b><br>₹${p.price} <s style="font-size:11px">₹${p.oldPrice||''}</s><br><small>Sarees</small><br><button style="width:100%;margin-top:5px;background:#e91e63;color:#fff;border:0;padding:6px;border-radius:6px">Add to Cart</button></div></div>`).join('');
 document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);
}
function openDetail(id){
 cur=products.find(p=>p.id==id); cSlide=0;
 document.getElementById('dTitle').innerText=cur.name;
 document.getElementById('dPrice').innerText='₹'+cur.price;
 document.getElementById('dOld').innerText=cur.oldPrice?'₹'+cur.oldPrice:'';
 document.getElementById('dRating').innerText=cur.rating||'';
 document.getElementById('dHigh').innerHTML=(cur.highlights||[]).map(h=>`<li>${h}</li>`).join('');
 document.getElementById('dDesc').innerText=cur.desc||'';
 allSlides=[...cur.images]; if(cur.video) allSlides.push({video:cur.video});
 document.getElementById('slider').innerHTML=allSlides.map(s=>{
   if(typeof s=='object'){ let u=s.video; if(u.includes('watch?v=')) u=u.replace('watch?v=','embed/'); if(u.includes('youtu.be/')) u='https://www.youtube.com/embed/'+u.split('/').pop().split('?')[0]; return `<div class="slide"><iframe src="${u}" allowfullscreen></iframe></div>` }
   else return `<div class="slide"><img src="${s}"></div>`
 }).join('');
 document.getElementById('dots').innerHTML=allSlides.map((_,i)=>`<span class="dot ${i==0?'active':''}"></span>`).join('');
 document.getElementById('detail').style.display='block';
 updateSlider();
}
function updateSlider(){
 document.getElementById('slider').scrollTo({left:cSlide*document.getElementById('slider').clientWidth, behavior:'smooth'});
 document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i==cSlide));
}
function moveSlide(d){ cSlide=(cSlide+d+allSlides.length)%allSlides.length; updateSlider(); }
function closeDetail(){ document.getElementById('detail').style.display='none'; }
function addFromDetail(){ addCart(cur.id); closeDetail(); }
function addCart(id){ let f=cart.find(x=>x.id==id); if(f) f.qty++; else{ let p=products.find(x=>x.id==id); cart.push({...p,qty:1}); } localStorage.setItem('umas_cart',JSON.stringify(cart)); render(); }
function openCart(){ if(!cart.length) return alert('Cart empty'); let n=prompt('Name?'), ph=prompt('Phone e.g. 90******11?'), ad=prompt('Address?'); if(!n||!ph||!ad) return; let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]'); orders.push({id:Date.now(),name:n,phone:ph,addr:ad,items:cart,total:cart.reduce((a,b)=>a+b.price*b.qty,0),delivery:new Date(Date.now()+4*86400000).toLocaleDateString()}); localStorage.setItem('umas_orders',JSON.stringify(orders)); cart=[]; localStorage.setItem('umas_cart','[]'); render(); alert('Order Placed!'); }
function trackOrder(){ let ph=document.getElementById('trackPhone').value.trim(); if(!ph) return alert('Enter phone'); let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]'); let f=orders.filter(o=>o.phone==ph); let r=document.getElementById('trackResult'); if(!f.length) r.innerHTML=`<p style="color:red">No orders found for ${ph.substring(0,2)}******${ph.slice(-2)}</p>`; else r.innerHTML=f.map(o=>`<div style="border:1px solid #ddd;padding:10px;border-radius:8px;margin:5px 0"><b>Order #${o.id}</b><br>Total: ₹${o.total}<br>Delivery: ${o.delivery}</div>`).join(''); }
render();
document.getElementById('products').addEventListener('click', function(e){ if(e.target.tagName=='BUTTON'){ e.stopPropagation(); let id=products[0].id; } });
</script>
</body>
</html>
