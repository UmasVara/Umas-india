<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umas.India</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f7f7f7}
.header{background:#e91e63;color:#fff;text-align:center;padding:18px 10px}
.header h1{font-size:26px}
.header p{font-size:13px;margin-top:5px}
.header button{margin-top:10px;background:#fff;color:#e91e63;border:0;padding:8px 18px;border-radius:20px;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card img{width:100%;height:175px;object-fit:cover;background:#eee}
.card-body{padding:8px}
.card-body b{font-size:14px;display:block;height:32px;overflow:hidden}
.card-body span{font-size:12px;color:#777}
.price{color:#000;font-weight:bold;margin-top:4px}
.old{color:#999;text-decoration:line-through;font-size:11px;margin-left:5px}
.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:7px;border-radius:6px;margin-top:6px;font-weight:bold}
.track{background:#fff;margin:12px;padding:15px;border-radius:12px;border:1px solid #eee}
.track input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.track button{width:100%;padding:12px;background:#e91e63;color:#fff;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>Umas.India</h1>
<p>Owner: Umaswara | 7989333257<br>UPI: 7989333257@ybl</p>
<button onclick="document.getElementById('track').scrollIntoView({behavior:'smooth'})">📦 Track My Order</button>
</div>

<div id="products" class="products"></div>

<div id="track" class="track">
<h3>📦 Track My Order</h3>
<input id="phone" placeholder="Enter Phone e.g. 90******11">
<button onclick="track()">Track Now</button>
<div id="result" style="margin-top:10px"></div>
</div>

<script>
// YOUR OLD PRODUCTS - RESTORED
let defaultProducts = [
{id:1,name:"Kanchi Blue Saree",price:100,oldPrice:108,cat:"Sarees",images:["https://images.unsplash.com/photo-1610030469983-98e550d6193a?w=600"]},
{id:2,name:"Kanchi Green Saree",price:120,oldPrice:150,cat:"Sarees",images:["https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600"]}
];

let products = JSON.parse(localStorage.getItem('umas_products') || 'null');
// If products have broken Amazon images, restore old ones
if(!products || products[0].name.includes('Pigeon')){
  products = defaultProducts;
  localStorage.setItem('umas_products', JSON.stringify(products));
}

function render(){
 document.getElementById('products').innerHTML = products.map(p=>`
 <div class="card">
 <img src="${p.images[0]}" onerror="this.src='https://via.placeholder.com/300x400/e91e63/fff?text=${encodeURIComponent(p.name)}'">
 <div class="card-body">
 <b>${p.name}</b>
 <span>${p.cat||'Sarees'}</span>
 <div class="price">₹${p.price} <span class="old">₹${p.oldPrice||''}</span></div>
 <button class="btn" onclick="addCart(${p.id})">Add to Cart</button>
 </div>
 </div>`).join('');
}

let cart = JSON.parse(localStorage.getItem('umas_cart')||'[]');
function addCart(id){
 let f=cart.find(x=>x.id==id);
 if(f) f.qty++; else cart.push({...products.find(x=>x.id==id),qty:1});
 localStorage.setItem('umas_cart',JSON.stringify(cart));
 alert('Added to Cart!');
}
function track(){
 let ph=document.getElementById('phone').value.trim();
 if(!ph) return alert('Enter phone');
 let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]');
 let found=orders.filter(o=>o.phone==ph);
 let r=document.getElementById('result');
 if(found.length==0) r.innerHTML=`<p style="color:red">No orders for ${ph.substring(0,2)}******${ph.slice(-2)}</p>`;
 else r.innerHTML=found.map(o=>`<div style="border:1px solid #ddd;padding:10px;border-radius:8px;margin:5px 0">Order #${o.id}<br>Total: ₹${o.total}<br>Delivery: ${o.delivery}</div>`).join('');
}
render();
</script>
</body>
</html>
