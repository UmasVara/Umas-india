<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Umas NEW</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fff8f0}.header{background:#e91e63;color:#fff;text-align:center;padding:20px}.banner{background:orange;text-align:center;padding:10px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1)}.card-body{padding:10px}.btn{width:100%;background:#e91e63;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:bold;margin-top:6px}.track{background:#fff;margin:10px;padding:15px;border-radius:12px;border:2px solid #e91e63}</style></head><body>
<div class="banner">✨ NEW with Cancel Approval</div>
<div class="header"><h2>Umas.India - NEW</h2><p>Owner: 7989333257</p><p style="margin-top:8px"><a href="admin-new.html" style="color:#fff">NEW Admin</a> | <a href="index.html" style="color:#fff">OLD Shop</a></p></div>
<div class="grid">
<div class="card"><div style="background:#e3f2fd;padding:40px;text-align:center">Blue Saree</div><div class="card-body"><b>Blue - Rs100</b><button class="btn" onclick="buy('Blue Saree',100)">Buy Now</button></div></div>
<div class="card"><div style="background:#e8f5e9;padding:40px;text-align:center">Green Saree</div><div class="card-body"><b>Green - Rs120</b><button class="btn" onclick="buy('Green Saree',120)">Buy Now</button></div></div>
</div>
<div class="track"><h3 style="text-align:center">📦 Track Your Order</h3><input id="ph" type="tel" placeholder="Enter phone" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:10px"><button onclick="track()" style="width:100%;padding:12px;background:#000;color:#fff;border:0;border-radius:8px;margin-top:8px">Track</button><div id="res" style="margin-top:12px"></div></div>
<script>
function buy(n,p){let phone=prompt('Enter 10 digit phone:');if(!phone)return;phone=phone.replace(/\D/g,'');if(phone.length<10)return alert('Enter valid');let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]');all.push({id:'ORD'+Date.now(),phone:phone,productName:n,total:p,status:'Pending',prevStatus:'Pending',cancelReason:'',date:new Date().toISOString()});localStorage.setItem('umas_orders_new',JSON.stringify(all));alert('Order Placed!');document.getElementById('ph').value=phone;track();}
function track(){let ph=document.getElementById('ph').value.trim();let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]').filter(o=>o&&o.phone);if(ph)all=all.filter(o=>String(o.phone).includes(ph));if(all.length==0){document.getElementById('res').innerHTML='<p style=text-align:center;padding:15px>No orders</p>';return;}document.getElementById('res').innerHTML=all.reverse().map(o=>{let btn='';if(o.status=='Pending'||o.status=='Packed'){btn=`<button onclick="requestCancel('${o.id}')" style='margin-top:6px;background:#fff;color:red;border:1px solid red;padding:6px 14px;border-radius:15px'>Request Cancellation</button>`;}else if(o.status=='Cancel Requested'){btn=`<div style='margin-top:6px;background:#fff3e0;padding:8px;border-radius:6px;font-size:12px'>⏳ Cancellation Requested - Waiting for Approval</div>`;}else if(o.status=='Cancelled'){btn=`<div style='margin-top:6px;background:#ffebee;padding:8px;border-radius:6px;color:red;font-size:12px'>❌ Cancelled (Approved by Owner)</div>`;}else{btn=`<div style='margin-top:6px;font-size:12px;color:#666'>Cannot cancel - ${o.status}</div>`;}return `<div style='background:#f9f9f9;padding:10px;border-radius:8px;margin-bottom:8px;border-left:5px solid ${o.status=='Cancel Requested'?'orange':'#e91e63'}'><b>📱 ${o.phone}</b> - <b style='color:${o.status=='Cancel Requested'?'orange':'#e91e63'}'>${o.status}</b><br><b>${o.productName}</b> Rs${o.total}<br><small>${new Date(o.date).toLocaleString()} | ${o.id}</small><br>${btn}</div>`;}).join('');}
function requestCancel(id){let reason=prompt('Reason for cancellation?');let all=JSON.parse(localStorage.getItem('umas_orders_new')||'[]');let o=all.find(x=>x.id==id);if(o){o.prevStatus=o.status;o.status='Cancel Requested';o.cancelReason=reason||'No reason';o.cancelRequestDate=new Date().toISOString();localStorage.setItem('umas_orders_new',JSON.stringify(all));track();alert('Request sent to owner - Wait for approval');}}
</script></body></html>
