<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umas.India Shop NEW</title>
<style>body{font-family:system-ui;background:#f5f5f7;margin:0}header{background:#5d2a0a;color:#fff;padding:14px;text-align:center;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:16px;overflow:hidden}.card img.main{width:100%;height:180px;object-fit:cover}.orders{background:#fff;margin:10px;border-radius:16px;padding:12px}.order-item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}.modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%}</style></head>
<body><header>Umas.India - NEW</header>
<div id="ordersBox" class="orders" style="display:none"><h3>My Orders - Buyer can delete</h3><div id="ordersList"></div></div>
<div id="grid" class="grid"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')this.style.display='none'"><div class="modal-box"><img id="mImg" style="width:100%;height:300px;object-fit:contain;background:#f5f5f5" src=""><div id="mThumbs" style="display:flex;gap:6px;padding:10px"></div><div id="mVideo" style="padding:10px"></div><div style="padding:12px"><h3 id="mName"></h3><div><b id="mPrice"></b> <s id="mMrp"></s></div><button onclick="placeOrder()" style="width:100%;padding:12px;background:#e91e63;color:#fff;border:0;border-radius:10px;font-weight:700;margin-top:10px">Buy Now</button><button onclick="document.getElementById('modal').style.display='none'" style="width:100%;padding:12px;background:#eee;border:0;border-radius:10px;margin-top:6px">Close</button></div></div></div>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]'),orders=JSON.parse(localStorage.getItem('umas_orders')||'[]'),current=null;
function renderProducts(){grid.innerHTML=products.map((p,i)=>`<div class="card" onclick="openProduct(${i})"><img class="main" src="${p.images[0]}"><div style="padding:10px"><div style="font-weight:700">${p.name}</div><div>₹${p.price}</div></div></div>`).join('');}
function openProduct(i){current=products[i];modal.style.display='flex';mName.textContent=current.name;mPrice.textContent='₹'+current.price;mMrp.textContent=current.mrp!=current.price?'₹'+current.mrp:'';mImg.src=current.images[0];mThumbs.innerHTML=current.images.map(im=>`<img src="${im}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;cursor:pointer" onclick="mImg.src=this.src">`).join('');let v=current.video||'',vh='';if(v){if(v.includes('youtube')||v.includes('youtu.be')){let id=v.split('v=')[1]?.split('&')[0]||v.split('/').pop();vh=`<iframe height="200" width="100%" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`;}else{vh=`<video controls width="100%" src="${v}"></video>`;}}mVideo.innerHTML=vh?'<b>Video</b>'+vh:'';}
function placeOrder(){orders.unshift({id:Date.now(),name:current.name,price:current.price,image:current.images[0],date:new Date().toLocaleString()});localStorage.setItem('umas_orders',JSON.stringify(orders));renderOrders();modal.style.display='none';alert('Order Placed!');}
function deleteOrder(id){if(confirm('Delete order?')){orders=orders.filter(o=>o.id!==id);localStorage.setItem('umas_orders',JSON.stringify(orders));renderOrders();}}
function renderOrders(){if(!orders.length){ordersBox.style.display='none';return;}ordersBox.style.display='block';ordersList.innerHTML=orders.map(o=>`<div class="order-item"><div style="display:flex;gap:8px"><img src="${o.image}" style="width:40px;height:40px;border-radius:6px;object-fit:cover"><div><div style="font-weight:700">${o.name}</div><div style="font-size:12px">${o.date} ₹${o.price}</div></div></div><button onclick="deleteOrder(${o.id})" style="background:#222;color:#fff;border:0;padding:6px 12px;border-radius:8px">Delete</button></div>`).join('');}
renderProducts();renderOrders();
</script></body></html>
