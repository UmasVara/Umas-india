<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Umas.India</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>body{font-family:system-ui;padding:12px;background:#f0f2f5;margin:0}input,select{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#e91e63;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:700;margin:6px 0;cursor:pointer}.card{background:#fff;padding:14px;margin:10px 0;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.orderCard{border-left:5px solid #e91e63}.addrBox{background:#fff3cd;padding:8px;border-radius:6px;margin:8px 0;border:1px dashed #e91e63}</style></head><body>
<div id="a" style="max-width:380px;margin:60px auto;background:#fff;padding:20px;border-radius:16px;text-align:center"><h2>Umas.India Admin</h2><p>7989333257</p><input id="p" type="password" placeholder="Password"><button onclick="if(p.value==='umas2024'||p.value==='Business@1008'){a.style.display='none';b.style.display='block';load()}else alert('Wrong')">Login</button></div>
<div id="b" style="display:none;max-width:700px;margin:0 auto"><h2>Admin Panel - Umas.India</h2>
<div style="background:#fff;padding:12px;border-radius:12px"><input id="n" placeholder="Product Name *"><input id="pr" type="number" placeholder="Price *"><input id="mr" type="number" placeholder="MRP"><select id="ct"><option>Sarees</option><option>Kurtis</option><option>Menswear</option><option>Kidswear</option><option>Home</option></select><input id="im" placeholder="Image URL"><button onclick="add()">Add LIVE</button></div>
<h3>Products (<span id="co">0</span>)</h3><div id="pl" class="grid"></div>
<h3>🔔 Orders (Newest First) - <span id="oc">0</span></h3><div id="od">Loading orders...</div>
</div>
<script>
const C={apiKey:"AIzaSyA2CKqJnhdVijyCmrJPrxP21fVhIQI9LWk",authDomain:"umasindia-4cd69.firebaseapp.com",projectId:"umasindia-4cd69",storageBucket:"umasindia-4cd69.firebasestorage.app",messagingSenderId:"441625672930",appId:"1:441625672930:web:0e80f6a292950d6dbd72bb"};
firebase.initializeApp(C);const db=firebase.firestore();
function add(){let d={name:n.value,price:Number(pr.value),mrp:Number(mr.value),category:ct.value,image:im.value,stock:50,date:new Date()};if(!d.name||!d.price)return alert("Name Price");db.collection("products").add(d).then(()=>{alert("Added!");n.value='';pr.value='';mr.value='';im.value='';})}
function load(){
db.collection("products").orderBy("date","desc").onSnapshot(s=>{let h="";let c=0;s.forEach(x=>{c++;let p=x.data();h+=`<div class=card><img src=${p.image||'https://via.placeholder.com/150'} style=width:100%;height:80px;object-fit:cover><br>${p.name} ₹${p.price}<br><button onclick="db.collection('products').doc('${x.id}').delete()" style=background:#333;padding:6px>Delete</button></div>`});pl.innerHTML=h;co.innerText=c});
db.collection("orders").orderBy("date","desc").onSnapshot(s=>{
let h="";let count=0;
s.forEach(x=>{
count++;
let o=x.data();
let d=o.localDate||(o.date?.toDate?.().toLocaleString())||'Now';
let items=(o.items||[]).map(i=>`${i.name} x${i.qty||1} (₹${i.price})`).join('<br>');
let name=o.customer?.name||'No Name';
let phone=o.customer?.phone||'No Phone';
let address=o.customer?.address||'<b style=color:red>NO ADDRESS - Old order, ask customer on call</b>';
h+=`<div class="card orderCard">
<b style="font-size:18px;">${name} - ${phone}</b><br>
<div style="margin:6px 0;">${items}</div>
<b>Total: ₹${o.total} - ${o.method||o.status||'COD'}</b><br>
<div class="addrBox">📍 <b>DELIVERY ADDRESS:</b><br>${address}</div>
<small>🕒 ${d}</small><br>
<div style="display:flex;gap:6px;margin-top:8px;">
<a href="tel:${phone}" style="flex:1;background:#4caf50;color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;">📞 Call</a>
<a href="https://wa.me/91${phone.replace(/[^0-9]/g,'').slice(-10)}?text=Hi ${name}, your order of Rs.${o.total} from Umas.India is confirmed!" target="_blank" style="flex:1;background:#25D366;color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;">💬 WhatsApp</a>
</div>
<button onclick="if(confirm('Delete this order?'))db.collection('orders').doc('${x.id}').delete()" style="background:#333;padding:6px;margin-top:8px;width:auto;">Delete Order</button>
</div>`;
});
oc.innerText=count;
od.innerHTML=h||"No orders yet";
});
}
</script></body></html>
