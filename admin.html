<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Umas.India</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f5f5f5;padding:10px}
.box{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
button{padding:10px 15px;background:#e91e63;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.prod{display:flex;gap:10px;border-bottom:1px solid #eee;padding:10px 0}
.prod img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.top{display:flex;justify-content:space-between;align-items:center;background:#e91e63;color:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
</style>
</head>
<body>

<div id="login" class="box" style="max-width:400px;margin:50px auto;text-align:center">
<h2>Admin Login</h2>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="check()">Login</button>
<p style="font-size:12px;color:#777;margin-top:10px">Password: Business@1008</p>
</div>

<div id="main" style="display:none">
<div class="top">
<b>Umas.India - Admin</b>
<div>
<button onclick="location.href='index.html'" style="background:#fff;color:#e91e63;padding:6px 10px">View Shop</button>
<button onclick="logout()" style="background:#000;margin-left:5px;padding:6px 10px">Logout</button>
</div>
</div>

<div class="box">
<h3>Add New Product</h3>
<input id="pName" placeholder="Product Name e.g. Kanchi Blue Saree">
<input id="pPrice" type="number" placeholder="Price e.g. 100">
<input id="pOld" type="number" placeholder="Old Price e.g. 108 (optional)">
<input id="pCat" placeholder="Category e.g. Sarees" value="Sarees">
<textarea id="pImages" placeholder="Image URL - Paste your saree photo link here. For multiple images, separate with comma"></textarea>
<small style="color:#666">Upload photo to <a href="https://imgbb.com" target="_blank">imgbb.com</a> and paste direct link here</small><br><br>
<input id="pVideo" placeholder="YouTube Video Link (optional)">
<button onclick="addProduct()" style="width:100%">Add Product</button>
</div>

<div class="box">
<h3>Products (<span id="count">0</span>)</h3>
<div id="list"></div>
<button onclick="clearAllProducts()" style="background:#000;margin-top:10px">Clear All Pigeon/Rice Cooker Products & Restore Old</button>
</div>

<div class="box">
<h3>Orders</h3>
<div id="orders"></div>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('umas_products')||'[]');
let orders = JSON.parse(localStorage.getItem('umas_orders')||'[]');

function check(){
 let p=document.getElementById('pass').value;
 if(p==='Business@1008' || p==='umas2024'){
   document.getElementById('login').style.display='none';
   document.getElementById('main').style.display='block';
   render();
 } else alert('Wrong Password');
}
function logout(){ location.reload(); }

function addProduct(){
 let name=document.getElementById('pName').value.trim();
 let price=parseInt(document.getElementById('pPrice').value);
 let oldPrice=parseInt(document.getElementById('pOld').value)||'';
 let cat=document.getElementById('pCat').value||'Sarees';
 let imgStr=document.getElementById('pImages').value.trim();
 let video=document.getElementById('pVideo').value.trim();
 if(!name || !price || !imgStr) return alert('Fill Name, Price, Image');
 let images = imgStr.split(',').map(s=>s.trim()).filter(s=>s);
 let id = Date.now();
 products.push({id,name,price,oldPrice,cat,images,video,rating:'4.5',highlights:[cat],desc:name});
 localStorage.setItem('umas_products',JSON.stringify(products));
 document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pOld').value=''; document.getElementById('pImages').value=''; document.getElementById('pVideo').value='';
 render();
 alert('Product Added!');
}

function render(){
 document.getElementById('count').innerText=products.length;
 document.getElementById('list').innerHTML=products.map((p,i)=>`
 <div class="prod">
 <img src="${p.images[0]}" onerror="this.src='https://via.placeholder.com/60'">
 <div style="flex:1"><b>${p.name}</b><br>₹${p.price} - ${p.cat||''}<br><small>${p.images[0].substring(0,30)}...</small></div>
 <button onclick="del(${i})" style="background:#000;height:35px">Delete</button>
 </div>`).join('') || 'No products';

 let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]');
 document.getElementById('orders').innerHTML=orders.reverse().map(o=>`
 <div style="border:1px solid #ddd;padding:10px;border-radius:8px;margin:6px 0">
 <b>Order #${o.id}</b> - ₹${o.total}<br>
 ${o.name} - ${o.phone}<br>
 ${o.addr}<br>
 <small>${o.delivery||''}</small><br>
 Items: ${(o.items||[]).map(it=>it.name).join(', ')}
 </div>`).join('') || 'No orders yet';
}

function del(i){ if(confirm('Delete this product?')){ products.splice(i,1); localStorage.setItem('umas_products',JSON.stringify(products)); render(); } }

function clearAllProducts(){
 if(confirm('This will delete Pigeon/Rice Cooker products and restore your old Kanchi sarees. Continue?')){
   let newProds = [
   {id:1,name:"Kanchi Blue Saree",price:100,oldPrice:108,cat:"Sarees",images:["https://images.unsplash.com/photo-1610030469983-98e550d6193a?w=600"],rating:"4.5"},
   {id:2,name:"Kanchi Green Saree",price:120,oldPrice:150,cat:"Sarees",images:["https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600"],rating:"4.5"}
   ];
   products = newProds;
   localStorage.setItem('umas_products',JSON.stringify(products));
   render();
   alert('Old products restored! Now go to main shop and refresh.');
 }
}
</script>
</body>
</html>
