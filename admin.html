<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2;padding:15px;margin:0}
h1{font-size:26px;margin:10px 0}
.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:15px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:6px 0}
.add{width:100%;background:#e91e63;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#fff;border-radius:10px;padding:8px}
.item img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.del{width:100%;background:#333;color:#fff;border:0;padding:8px;border-radius:20px;margin-top:5px}
</style>
</head>
<body>
<div id="login" class="card" style="max-width:350px;margin:80px auto;text-align:center">
<h2>Admin Login</h2>
<input id="pw" type="password" placeholder="Password">
<button class="add" onclick="login()">Login</button>
<p style="font-size:11px;color:gray">Business@1008</p>
</div>
<div id="main" style="display:none">
<h1>Admin Panel</h1>
<div class="card">
<input id="n" placeholder="Name *">
<input id="pr" type="number" placeholder="Price *">
<input id="mrp" type="number" placeholder="MRP">
<select><option>Sarees</option></select>
<input id="img" placeholder="Image URL">
<button class="add" onclick="add()">Add LIVE</button>
</div>
<h2>Products (<span id="c">0</span>)</h2>
<div id="grid" class="grid"></div>
<h2 style="margin-top:20px">Orders</h2>
<div>No orders</div>
<br><a href="index.html">Back to Shop</a>
</div>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]');
function login(){
if(document.getElementById('pw').value==='Business@1008'){
document.getElementById('login').style.display='none';
document.getElementById('main').style.display='block';
render();
}else alert('Wrong');
}
function add(){
let name=document.getElementById('n').value;
let price=document.getElementById('pr').value;
let mrp=document.getElementById('mrp').value;
let img=document.getElementById('img').value;
if(!name||!price||!img)return alert('Fill Name, Price, Image');
products.push({id:Date.now(),name,price,mrp,img});
localStorage.setItem('umas_products',JSON.stringify(products));
render();
document.getElementById('n').value='';document.getElementById('pr').value='';document.getElementById('mrp').value='';document.getElementById('img').value='';
}
function render(){
document.getElementById('c').innerText=products.length;
document.getElementById('grid').innerHTML=products.map((p,i)=>`<div class="item"><img src="${p.img}"><div>${p.name} ₹${p.price}</div><button class="del" onclick="del(${i})">Delete</button></div>`).join('');
}
function del(i){
products.splice(i,1);
localStorage.setItem('umas_products',JSON.stringify(products));
render();
}
</script>
</body>
</html>
