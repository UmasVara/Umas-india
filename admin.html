<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>body{font-family:system-ui;padding:12px;background:#f0f2f5}input,textarea,select{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#e91e63;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:700;margin:6px 0}.card{background:#fff;padding:10px;margin:8px 0;border-radius:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div id="a" style="max-width:380px;margin:60px auto;background:#fff;padding:20px;border-radius:16px;text-align:center"><h2>Umas.India Admin</h2><p>7989333257</p><input id="p" type="password" placeholder="umas2024"><button onclick="if(p.value==='umas2024'){a.style.display='none';b.style.display='block';load()}else alert('Wrong')">Login</button></div><div id="b" style="display:none;max-width:700px;margin:0 auto"><h2>Admin Panel</h2><div style="background:#fff;padding:12px;border-radius:12px"><input id="n" placeholder="Name *"><input id="pr" type="number" placeholder="Price *"><input id="mr" type="number" placeholder="MRP"><select id="ct"><option>Sarees</option><option>Kurtis</option><option>Menswear</option><option>Kidswear</option><option>Home</option></select><input id="im" placeholder="Image URL"><button onclick="add()">Add LIVE</button></div><h3>Products (<span id="co">0</span>)</h3><div id="pl" class="grid"></div><h3>Orders</h3><div id="od"></div></div><script>const C={apiKey:"AIzaSyA2CKqJnhdVijyCmrJPrxP21fVhIQI9LWk",authDomain:"umasindia-4cd69.firebaseapp.com",projectId:"umasindia-4cd69",storageBucket:"umasindia-4cd69.firebasestorage.app",messagingSenderId:"441625672930",appId:"1:441625672930:web:0e80f6a292950d6dbd72bb"};firebase.initializeApp(C);const db=firebase.firestore();function add(){let d={name:n.value,price:Number(pr.value),mrp:Number(mr.value),category:ct.value,image:im.value,stock:50,date:new Date()};if(!d.name||!d.price)return alert("Name Price");db.collection("products").add(d).then(()=>alert("Added!"))}function load(){db.collection("products").orderBy("date","desc").onSnapshot(s=>{let h="";let c=0;s.forEach(x=>{c++;let p=x.data();h+=`<div class=card><img src=${p.image||'https://via.placeholder.com/150'} style=width:100%;height:80px;object-fit:cover><br>${p.name} ₹${p.price}<br><button onclick=db.collection('products').doc('${x.id}').delete() style=background:#333;padding:6px>Delete</button></div>`});pl.innerHTML=h;co.innerText=c});db.collection("orders").orderBy("date","desc").onSnapshot(s=>{let h="";s.forEach(x=>{let o=x.data();let d=o.date?.toDate?.()||new Date();h+=`<div class=card>${o.customer?.name} ${o.customer?.phone} ₹${o.total} ${o.status}<br><small>${d.toLocaleString()}</small></div>`});od.innerHTML=h||"No orders"})}</script></body></html>
