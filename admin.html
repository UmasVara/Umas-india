<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:system-ui;padding:10px;background:#f5f5f5}input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px}button{background:#e91e63;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:bold}.box{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px}</style></head><body>
<div id="login" class="box" style="max-width:400px;margin:60px auto;text-align:center"><h2>Admin Login</h2><input id="pass" type="password" placeholder="Password"><button onclick="check()" style="width:100%">Login</button><p style="font-size:12px;color:#777">Business@1008</p></div>
<div id="main" style="display:none"><div class="box"><h3>Add Product</h3><input id="n" placeholder="Name"><input id="pr" placeholder="Price"><input id="img" placeholder="Image URL (from imgbb.com)"><button onclick="add()">Add</button></div><div class="box"><h3>Products</h3><div id="list"></div><button onclick="clearProds()" style="background:#000;margin-top:10px">Restore Old Kanchi Sarees (Fix Images)</button></div><div class="box"><h3>Orders</h3><div id="orders"></div></div><a href="index.html">Back to Shop</a></div>
<script>
let products=JSON.parse(localStorage.getItem('umas_products')||'[]');
function check(){if(document.getElementById('pass').value==='Business@1008'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';render()}else alert('Wrong');}
function add(){let name=document.getElementById('n').value,price=parseInt(document.getElementById('pr').value),img=document.getElementById('img').value;if(!name||!price||!img)return alert('Fill all');products.push({id:Date.now(),name,price,oldPrice:'',cat:'Sarees',images:[img]});localStorage.setItem('umas_products',JSON.stringify(products));render();alert('Added');}
function render(){document.getElementById('list').innerHTML=products.map((p,i)=>`<div style="display:flex;gap:10px;padding:8px;border-bottom:1px solid #eee"><img src="${p.images[0]}" width="50" height="50"><div style="flex:1">${p.name}<br>₹${p.price}</div><button onclick="del(${i})">X</button></div>`).join('');let orders=JSON.parse(localStorage.getItem('umas_orders')||'[]');document.getElementById('orders').innerHTML=orders.map(o=>`<div style="border:1px solid #ddd;padding:8px;margin:5px 0;border-radius:8px">${o.name} - ${o.phone} - ₹${o.total}</div>`).join('')||'No orders';}
function del(i){products.splice(i,1);localStorage.setItem('umas_products',JSON.stringify(products));render();}
function clearProds(){products=[{id:1,name:"Kanchi Blue Saree",price:100,oldPrice:108,cat:"Sarees",images:["https://images.unsplash.com/photo-1610030469983-98e550d6193a?w=600"]},{id:2,name:"Kanchi Green Saree",price:120,oldPrice:150,cat:"Sarees",images:["https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=600"]}];localStorage.setItem('umas_products',JSON.stringify(products));render();alert('Fixed!');}
</script></body></html>
