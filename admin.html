<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - Umas.India</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#f2f2f2;padding:15px}
h1{font-size:28px;margin:20px 0 15px 5px;font-weight:800}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px}
input,select{width:100%;padding:14px 16px;border:1.5px solid #ccc;border-radius:12px;margin:7px 0;font-size:15px;outline:none;background:#fff}
input:focus{border-color:#e91e63}
.addBtn{width:100%;background:#e91e63;color:#fff;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}
.products-title{font-size:22px;font-weight:800;margin:5px 0 15px 5px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prod img{width:100%;height:130px;object-fit:cover;border-radius:8px;background:#eee}
.prod-name{font-size:15px;margin:8px 0 6px 0;font-weight:500;line-height:1.3;height:40px;overflow:hidden}
.delBtn{width:100%;background:#333;color:#fff;border:0;padding:9px;border-radius:20px;font-weight:bold;margin-top:5px}
.orders-title{font-size:22px;font-weight:800;margin:25px 0 10px 5px}
.login{max-width:400px;margin:80px auto;text-align:center}
</style>
</head>
<body>

<div id="loginBox" class="card login">
<h2 style="margin-bottom:15px">Admin Login</h2>
<input id="pass" type="password" placeholder="Password">
<button class="addBtn" onclick="checkPass()">Login</button>
<p style="font-size:12px;color:#888;margin-top:10px">Password: Business@1008</p>
</div>

<div id="main" style="display:none">
<h1>Admin Panel</h1>

<div class="card">
<input id="pName" placeholder="Name *">
<input id="pPrice" type="number" placeholder="Price *">
<input id="pMrp" type="number" placeholder="MRP">
<select id="pCat"><option>Sarees</option><option>Kurti</option><option>Blouse</option><option>Mens</option></select>
<input id="pImg" placeholder="Image URL">
<button class="addBtn" onclick="addLive()">Add LIVE</button>
</div>

<div class="products-title">Products (<span id="count">0</span>)</div>
<div id="prodGrid" class="prod-grid"></div>

<div class="orders-title">Orders</div>
<div id="orders" style="padding-left:5px;color:#333">No orders</div>

<div style="text-align:center;margin-top:30px">
<a href="index.html" style="color:#e91e63;text-decoration:none;font-size:14px">← Back to Shop</a><br><br>
<button onclick="fixImages()" style="background:#000;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-size:12px">Fix Broken Images</button>
</div>
</div>
