<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2;padding:15px}
h1{font-size:28px;font-weight:800;margin:15px 0}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
input,select{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;margin:6px 0;font-size:15px}
.addBtn{width:100%;background:#e91e63;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:bold;font-size:16px;margin-top:10px}
.title{font-size:20px;font-weight:800;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#fff;border-radius:14px;padding:10px}
.item img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#eee}
.item p{font-size:14px;margin:8px 0;height:34px;overflow:hidden}
.del{width:100%;background:#222;color:#fff;border:0;padding:9px;border-radius:20px;font-weight:bold}
#loginBox{max-width:380px;margin:80px auto;text-align:center}
</style>
</head>
<body>

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="password" type="password" placeholder="Enter Password">
<button class="addBtn" onclick="doLogin()">Login</button>
<p style="font-size:12px;color:#888;margin-top:8px">Password: Business@1008</p>
</div>

<div id="mainBox" style="display:none">
<h1>Admin Panel</h1>

<div class="card">
<input id="pName" placeholder="Name *">
<input id="pPrice" type="number" placeholder="Price *">
<input id="pMrp" type="number" placeholder="MRP">
<select id="pCat"><option>Sarees</option><option>Kurti</option><option>Blouse</option><option>Mens</option></select>
<input id="pImg" placeholder="Image URL">
<button class="addBtn" onclick="addProduct()">Add LIVE</button>
</div>

<div class="title">Products (<span id="count">0</span>)</div>
<div id="productGrid" class="grid"></div>

<div class="title" style="margin-top:25px">Orders</div>
<div id="orderBox">No orders</div>

<div style="text-align:center;margin:30px 0">
<a href="index.html" style="color:#e91e63;text-decoration:none">← Back to Shop</a>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('umas_products_v2')||'[]');

function doLogin(){
  if(document.getElementById('password').value === 'Business@1008'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('mainBox').style.display='block';
    render();
  } else {
    alert('Wrong Password! Use Business@1008');
  }
}

function addProduct(){
  let name = document.getElementById('pName').value.trim();
  let price = document.getElementById('pPrice').value.trim();
  let mrp = document.getElementById('pMrp').value.trim();
  let cat = document.getElementById('pCat').value;
  let img = document.getElementById('pImg').value.trim();
  if(!name || !price){ alert('Name and Price required *'); return; }
  if(!img){ alert('Please add Image URL'); return; }
  products.push({id:Date.now(), name:name, price:parseInt(price), mrp:mrp?parseInt(mrp):'', cat:cat, img:img});
  localStorage.setItem('umas_products_v2', JSON.stringify(products));
  document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pMrp').value=''; document.getElementById('pImg').value='';
  render();
  alert('Product Added LIVE!');
}

function render(){
  document.getElementById('count').innerText = products.length;
  document.getElementById('productGrid').innerHTML = products.map((p,i)=>`
    <div class="item">
      <img src="${p.img}">
      <p>${p.name} ₹${p.price}</p>
      <button class="del" onclick="deleteProduct(${i})">Delete</button>
    </div>
  `).join('') || '<p>No products</p>';
  
  let orders = JSON.parse(localStorage.getItem('umas_orders')||'[]');
  document.getElementById('orderBox').innerHTML = orders.length ? orders.map(o=>`<div style="background:#fff;padding:10px;border-radius:10px;margin:6px 0">#${o.id} - ${o.phone} - ₹${o.total}</div>`).join('') : 'No orders';
}

function deleteProduct(i){
  if(confirm('Delete this product?')){
    products.splice(i,1);
    localStorage.setItem('umas_products_v2', JSON.stringify(products));
    render();
  }
}
</script>
</body>
</html>
